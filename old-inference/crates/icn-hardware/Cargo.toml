[package]
name = "icn-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "icn-model-assessment"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
icn-contracts.workspace = true
llama-cpp-2 = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus"] }

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
cuda-no-vmm = ["llama-cpp-2/cuda-no-vmm"]
metal = ["llama-cpp-2/metal"]
mtmd = ["llama-cpp-2/mtmd"]
vulkan = ["llama-cpp-2/vulkan"]
