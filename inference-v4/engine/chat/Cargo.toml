[package]
name = "magnitude-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnitude-artifacts = { path = "../artifacts" }
magnitude-generation = { path = "../generation" }
magnitude-model-contracts = { path = "../model-contracts" }
magnitude-templates = { path = "../templates" }
serde.workspace = true
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
llguidance = { version = "=1.8.0", default-features = false, features = ["lark", "ahash"] }
