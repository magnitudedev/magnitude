[package]
name = "magnitude-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnitude-templates = { path = "../templates" }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
llguidance = { version = "=1.8.0", default-features = false, features = ["lark", "ahash"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
bytes = "=1.12.1"
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tokio = { version = "=1.53.0", features = ["rt", "net", "sync", "macros", "io-util", "time"] }
seismic-lang.workspace = true
seismic-std.workspace = true
seismic-runtime.workspace = true
seismic-realization.workspace = true
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["http-json", "reqwest"] }

[dev-dependencies]
seismic-metal.workspace = true
seismic-cpu.workspace = true
seismic-compiler.workspace = true
seismic-cuda.workspace = true
