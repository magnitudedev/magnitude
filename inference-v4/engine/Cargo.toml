[package]
name = "magnitude-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnitude-artifacts = { path = "artifacts" }
magnitude-chat = { path = "chat" }
magnitude-generation = { path = "generation" }
magnitude-service = { path = "service" }
magnitude-templates = { path = "templates" }
magnitude-model-batching = { path = "model-batching" }
magnitude-model-contracts = { path = "model-contracts" }
magnitude-model-executor = { path = "model-executor" }
magnitude-model-qwen35 = { path = "models/qwen35" }
magnitude-model-state = { path = "model-state" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
bytes = "=1.12.1"
base64 = "=0.13.1"
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tokio = { version = "=1.53.0", features = ["rt", "net", "sync", "macros", "io-util", "time"] }
seismic.workspace = true
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["http-json", "reqwest"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.189"

[features]
# Development-only: lets the `forward_bench` example record tuned
# configurations and replay them in a later run (bit-exact comparisons).
# The served `magnitude-engine` binary never installs a pin.
pinned-tuning = ["magnitude-model-executor/pinned-tuning"]
# Development-only: lets the `forward_bench` example survey every admissible
# tuning configuration (`--tuning-survey DIR`) for replaying the search.
tuning-survey = ["magnitude-model-executor/tuning-survey"]
