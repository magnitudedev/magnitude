[package]
name = "magnitude-solver-lab"
default-run = "magnitude-solver-lab"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnitude-solver = { path = "..", features = ["serde"] }
serde.workspace = true
serde_json = "=1.0.151"

[features]
qwen-source = ["dep:seismic-lang", "dep:seismic-std", "dep:seismic-compiler"]

[dependencies.seismic-lang]
workspace = true
optional = true

[dependencies.seismic-std]
workspace = true
optional = true

[dependencies.seismic-compiler]
workspace = true
optional = true

[[bin]]
name = "qwen-source"
path = "src/bin/qwen_source.rs"
required-features = ["qwen-source"]
