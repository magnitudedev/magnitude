[workspace]
resolver = "2"
members = [
  "solver",
  "solver/lab",
  "engine",
  "engine/artifacts",
  "engine/chat",
  "engine/generation",
  "engine/service",
  "engine/model-batching",
  "engine/model-contracts",
  "engine/model-executor",
  "engine/model-kernels",
  "engine/model-state",
  "engine/models/qwen35",
  "engine/templates",
  "seismic-std",
  "seismic/lang",
  "seismic/ir",
  "seismic/target",
  "seismic/estimator/core",
  "seismic/estimator/metal",
  "seismic/backends/metal",
  "seismic/backends/cpu",
  "seismic/backends/cuda",
  "seismic/cli",
  "seismic/compiler",
  "seismic/runtime",
  "seismic/api",
  "seismic/build",
  "seismic/corpus",
  "seismic/native-tests",
  "seismic/frontends/python",
]
default-members = [
  "solver",
  "solver/lab",
  "engine",
  "engine/templates",
  "seismic-std",
  "seismic/lang",
  "seismic/ir",
  "seismic/target",
  "seismic/estimator/core",
  "seismic/estimator/metal",
  "seismic/backends/metal",
  "seismic/backends/cpu",
  "seismic/backends/cuda",
  "seismic/cli",
  "seismic/compiler",
  "seismic/runtime",
  "seismic/api",
  "seismic/build",
  "seismic/corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
seismic-estimator-metal = { path = "seismic/estimator/metal" }
seismic-ir = { path = "seismic/ir" }
seismic-target = { path = "seismic/target" }
seismic-estimator = { path = "seismic/estimator/core" }
serde = { version = "=1.0.229", features = ["derive"] }
seismic-std = { path = "seismic-std" }
seismic-lang = { path = "seismic/lang" }
seismic-metal = { path = "seismic/backends/metal" }
seismic-cpu = { path = "seismic/backends/cpu" }
seismic-cuda = { path = "seismic/backends/cuda" }
seismic-compiler = { path = "seismic/compiler" }
seismic-runtime = { path = "seismic/runtime" }
seismic = { path = "seismic/api" }
seismic-build = { path = "seismic/build" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = 1
