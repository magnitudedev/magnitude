[package]
name = "seismic-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
seismic-lang.workspace = true
seismic-realization.workspace = true
seismic-accounting.workspace = true
seismic-compiler.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSObject", "NSRange"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePass", "MTLComputePipeline", "MTLBuffer", "MTLResource", "MTLTypes", "MTLAllocation", "MTLPipeline", "MTLDrawable", "MTLCounters"] }
