name: Hosted update acceptance

on:
  push:
    branches: [app]
    paths:
      - '.github/workflows/hosted-update-acceptance.yml'
      - 'desktop/src/*update*'
      - 'cli/src/startup/*update*'
      - 'packages/daemon-management/src/desktop-native/*update*'
      - 'packages/daemon-management/native/windows-update*'
      - 'packages/release/native/windows-installer*'
      - 'packages/release/scripts/acceptance/*'
      - 'packages/release/scripts/build/desktop-*'
      - 'packages/release/scripts/build/linux-maintainer-scripts.ts'
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: Build and upload a new installer cohort in addition to native checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-update-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-mac-apps:
    if: inputs.build_artifacts
    environment: apple-release
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["0.0.28", "0.0.29"]
    env:
      MAGNITUDE_APPLE_DISTRIBUTION: developer-id
      MAGNITUDE_ACCEPTANCE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Import Apple signing credentials
        run: bash packages/release/scripts/apple/credentials.sh
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Build matched application and service without rebuilding inference
        run: bun packages/release/scripts/acceptance/build-desktop.ts
        env:
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/magnitude-update-acceptance
      - name: Verify real storage transfers and prepare acceptance manifests
        run: bun packages/release/scripts/acceptance/prepare-artifacts.ts
        env:
          MAGNITUDE_ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/magnitude-update-acceptance/artifacts
          MAGNITUDE_ACCEPTANCE_COMMIT: ${{ github.sha }}
          DISTRIBUTION_ACCEPTANCE_PUBLISHER_PRIVATE_KEY: ${{ secrets.DISTRIBUTION_ACCEPTANCE_PUBLISHER_PRIVATE_KEY }}
          DISTRIBUTION_BLOB_READ_WRITE_TOKEN: ${{ secrets.DISTRIBUTION_BLOB_READ_WRITE_TOKEN }}
      - name: Retain signed installers and notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-acceptance-mac-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.dmg
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.zip
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.json
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/.apple/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-mac-${{ matrix.version }}
          path: ${{ runner.temp }}/magnitude-update-acceptance/artifacts/prepared-manifests.json
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: bash packages/release/scripts/apple/cleanup-credentials.sh

  linux-packages:
    if: inputs.build_artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        version: ["0.0.28", "0.0.29"]
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install packaging dependencies at the supported Linux baseline
        run: apt-get update && apt-get install -y git ca-certificates curl unzip build-essential python3 fakeroot rpm libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build matched Linux application and packages without rebuilding inference
        run: bun packages/release/scripts/acceptance/build-desktop.ts
        env:
          MAGNITUDE_ACCEPTANCE_VERSION: ${{ matrix.version }}
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/magnitude-update-acceptance
      - name: Verify Linux installation lease does not escape into updater children
        shell: bash
        run: |
          addon=$(find "$RUNNER_TEMP/magnitude-update-acceptance/application" -name desktop-host.node -print -quit)
          test -n "$addon"
          fixture="$GITHUB_WORKSPACE/packages/daemon-management/src/desktop-native/fixtures/linux-installation-lease.cjs"
          install -d -m 755 /var/lib/magnitude-desktop
          touch /var/lib/magnitude-desktop/installation.lock
          chmod 444 /var/lib/magnitude-desktop/installation.lock
          node "$fixture" "$addon" invalid
          node "$fixture" "$addon" invalid 9</dev/null
          node "$fixture" "$addon" valid 9</var/lib/magnitude-desktop/installation.lock
          touch /var/lib/magnitude-desktop/installing
          node "$fixture" "$addon" invalid 9</var/lib/magnitude-desktop/installation.lock
          rm /var/lib/magnitude-desktop/installing
      - name: Verify real storage transfers and prepare acceptance manifests
        run: bun packages/release/scripts/acceptance/prepare-artifacts.ts
        env:
          MAGNITUDE_ACCEPTANCE_VERSION: ${{ matrix.version }}
          MAGNITUDE_ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/magnitude-update-acceptance/artifacts
          MAGNITUDE_ACCEPTANCE_COMMIT: ${{ github.sha }}
          DISTRIBUTION_ACCEPTANCE_PUBLISHER_PRIVATE_KEY: ${{ secrets.DISTRIBUTION_ACCEPTANCE_PUBLISHER_PRIVATE_KEY }}
          DISTRIBUTION_BLOB_READ_WRITE_TOKEN: ${{ secrets.DISTRIBUTION_BLOB_READ_WRITE_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: update-acceptance-linux-${{ matrix.os }}-${{ matrix.version }}
          path: ${{ runner.temp }}/magnitude-update-acceptance/artifacts
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-linux-${{ matrix.os }}-${{ matrix.version }}
          path: ${{ runner.temp }}/magnitude-update-acceptance/artifacts/prepared-manifests.json
          if-no-files-found: error

  native-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise signed requests and update ownership on the native runtime
        working-directory: desktop
        run: bunx --bun vitest run src/update-identity.test.ts src/update-preferences.test.ts src/update-schedule.test.ts src/application-update.test.ts
      - name: Validate Windows private key permissions with native ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./packages/daemon-management/scripts/windows-toolchain.ps1
          $source = Join-Path $env:GITHUB_WORKSPACE 'packages/daemon-management/native'
          $fixture = Join-Path $env:RUNNER_TEMP 'update-key-permissions'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Push-Location $fixture
          try {
            npm install --prefix $fixture --ignore-scripts --no-audit --no-fund node-api-headers@1.9.0
            if ($LASTEXITCODE -ne 0) { throw 'Node-API header acquisition failed' }
            $headers = Join-Path $fixture 'node_modules/node-api-headers/include'
            & cl.exe /nologo /c /W4 /WX /O2 /std:c11 /D_WIN32_WINNT=0x0A00 /DNAPI_VERSION=8 /D_CRT_SECURE_NO_WARNINGS "/I$headers" (Join-Path $source 'desktop-host.c') (Join-Path $source 'windows-update-napi.c')
            if ($LASTEXITCODE -ne 0) { throw 'Windows update binding compilation failed' }
            & cl.exe /nologo /W4 /WX /O2 /std:c11 /D_WIN32_WINNT=0x0A00 /D_CRT_SECURE_NO_WARNINGS (Join-Path $source 'windows-security.c') (Join-Path $source 'windows-security-test.c') /Fe:security.exe /link advapi32.lib
            if ($LASTEXITCODE -ne 0) { throw 'Native permission compilation failed' }
            & ./security.exe
            if ($LASTEXITCODE -ne 0) { throw 'Native permission acceptance failed' }
          } finally { Pop-Location }
      - name: Validate package permission regressions
        working-directory: packages/release
        run: bunx --bun vitest run scripts/build/desktop-linux.test.ts
      - name: Verify real Debian package rollback restores application admission
        if: runner.os == 'Linux'
        run: bun packages/release/scripts/acceptance/linux-update-rollback.ts
      - name: Validate Windows installation inventory and configuration ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/release/scripts/test-windows-installer.ps1
      - name: Verify Windows update handoff state and cancellation
        if: runner.os == 'Windows'
        working-directory: packages/daemon-management
        run: bunx --bun vitest run src/desktop-native/windows-update-handoff.test.ts
      - name: Verify Windows Authenticode with actual signed and tampered executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/daemon-management/scripts/test-windows-update-signature.ps1
      - name: Send a real signed check to the isolated hosted endpoint
        run: bun packages/release/scripts/acceptance/check.ts
        env:
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/update-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: update-check-${{ matrix.os }}
          path: ${{ runner.temp }}/update-check.json
          if-no-files-found: error
          retention-days: 14
