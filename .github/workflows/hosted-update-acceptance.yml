name: Hosted update acceptance

on:
  workflow_dispatch:
  push:
    branches: [app]
    paths:
      - .github/workflows/hosted-update-acceptance.yml
      - packages/release/scripts/acceptance/**

permissions:
  contents: read

concurrency:
  group: hosted-update-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-mac-apps:
    environment: apple-release
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["0.0.14", "0.0.15"]
    env:
      MAGNITUDE_APPLE_DISTRIBUTION: developer-id
      MAGNITUDE_ACCEPTANCE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Import Apple signing credentials
        run: bash packages/release/scripts/apple/credentials.sh
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Build matched application and service without rebuilding inference
        run: bun packages/release/scripts/acceptance/build-desktop.ts
        env:
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/magnitude-update-acceptance
      - name: Retain signed installers and notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-acceptance-mac-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.dmg
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.zip
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/*.json
            ${{ runner.temp }}/magnitude-update-acceptance/artifacts/.apple/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Remove signing credentials
        if: always()
        run: bash packages/release/scripts/apple/cleanup-credentials.sh

  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        version: ["0.0.14", "0.0.15"]
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install packaging dependencies at the supported Linux baseline
        run: apt-get update && apt-get install -y git ca-certificates curl unzip build-essential python3 fakeroot rpm libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build matched Linux application and packages without rebuilding inference
        run: bun packages/release/scripts/acceptance/build-desktop.ts
        env:
          MAGNITUDE_ACCEPTANCE_VERSION: ${{ matrix.version }}
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/magnitude-update-acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: update-acceptance-linux-${{ matrix.os }}-${{ matrix.version }}
          path: ${{ runner.temp }}/magnitude-update-acceptance/artifacts
          if-no-files-found: error
          retention-days: 14

  native-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise signed requests and update ownership on the native runtime
        working-directory: desktop
        run: bunx --bun vitest run src/update-identity.test.ts src/update-preferences.test.ts src/update-schedule.test.ts src/application-update.test.ts
      - name: Send a real signed check to the isolated hosted endpoint
        run: bun packages/release/scripts/acceptance/check.ts
        env:
          MAGNITUDE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/update-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: update-check-${{ matrix.os }}
          path: ${{ runner.temp }}/update-check.json
          if-no-files-found: error
          retention-days: 14
