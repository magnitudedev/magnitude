name: Release build

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      validate_candidate:
        required: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.matrix.outputs.hosts }}
      backends: ${{ steps.matrix.outputs.backends }}
      cuda11_backends: ${{ steps.matrix.outputs.cuda11_backends }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: matrix
        run: bun run packages/release/scripts/matrix.ts
      - id: version
        shell: bash
        run: echo "version=$(jq -r '.version' packages/cli/package.json)" >> "$GITHUB_OUTPUT"

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run icn:catalog:build-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-inputs
          path: inference/target/catalog-inputs/
          if-no-files-found: error

  host:
    needs: [matrix, catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rustTarget }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.id == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-inputs
          path: catalog-inputs
      - run: bun run packages/release/scripts/build/host.ts "${{ matrix.id }}" catalog-inputs "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  backend:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.backends) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.host == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install Linux Vulkan tools
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').VULKAN_SDK
          if (-not $sdk) { throw "Vulkan SDK installation did not publish VULKAN_SDK" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Use Ninja for Windows backend build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ninja --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: Install Linux CUDA toolkit
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) repository_arch=x86_64 ;;
            aarch64) repository_arch=sbsa ;;
            *) exit 1 ;;
          esac
          . /etc/os-release
          repository_distribution="ubuntu${VERSION_ID//./}"
          toolkit="${{ matrix.toolkit }}"
          package_version="${toolkit/./-}"
          curl --fail --location --silent --show-error \
            --output cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/${repository_distribution}/${repository_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-compiler-${package_version}" \
            "libcublas-dev-${package_version}"
          cuda_path="/usr/local/cuda-${toolkit}"
          test -x "${cuda_path}/bin/nvcc"
          test -x "${cuda_path}/bin/cuobjdump"
          test -f "${cuda_path}/include/cublas_v2.h"
          echo "CUDA_PATH=${cuda_path}" >> "$GITHUB_ENV"
          echo "${cuda_path}/bin" >> "$GITHUB_PATH"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          rm -f cuda-keyring.deb
      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        with:
          cuda: "${{ matrix.toolkit }}.0"
          method: network
      - run: bun install --frozen-lockfile
      - name: Build backend with resource diagnostics
        shell: bash
        run: |
          bash scripts/release-build-diagnostics.sh run -- \
            bun run packages/release/scripts/build/backend.ts \
            "${{ matrix.id }}" \
            "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  cuda-11-8-backend:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cuda11_backends) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: nvidia/cuda:11.8.0-base-ubuntu22.04@sha256:f895871972c1c91eb6a896eee68468f40289395a1e58c492e1be7929d0f8703b
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install CUDA 11.8 build environment
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            cuda-compiler-11-8 \
            libcublas-dev-11-8 \
            libclang-dev \
            procps
          if [[ "$(uname -m)" == "aarch64" ]]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
          cuda_path=/usr/local/cuda-11.8
          test -x "${cuda_path}/bin/nvcc"
          test -x "${cuda_path}/bin/cuobjdump"
          test -f "${cuda_path}/include/cublas_v2.h"
          echo "CUDA_PATH=${cuda_path}" >> "$GITHUB_ENV"
          echo "${cuda_path}/bin" >> "$GITHUB_PATH"
          apt-get clean
          rm -rf /var/lib/apt/lists/*
      - run: bun install --frozen-lockfile
      - name: Build CUDA 11.8 backend with resource diagnostics
        run: |
          bash scripts/release-build-diagnostics.sh run -- \
            bun run packages/release/scripts/build/backend.ts \
            "${{ matrix.id }}" \
            "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  candidate:
    needs: [matrix, host, backend, cuda-11-8-backend]
    if: inputs.validate_candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: release-artifacts
      - id: npm-candidate
        run: bun run packages/release/scripts/prepare-npm.ts release/npm-candidate
      - run: bun run packages/release/scripts/assemble.ts release-artifacts release-candidate
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.matrix.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      - run: bun run packages/version/scripts/generate-version.ts
      - run: bun run scripts/accept-release-candidate.ts release-candidate "${{ steps.npm-candidate.outputs.tarball }}"
