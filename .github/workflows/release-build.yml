name: Release build

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      apple_distribution:
        required: false
        default: false
        type: boolean
      windows_distribution:
        required: false
        default: false
        type: boolean
      validate_candidate:
        required: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"
  MAGNITUDE_SOURCE_COMMIT: ${{ inputs.source_commit }}
  MAGNITUDE_APPLE_DISTRIBUTION: ${{ inputs.apple_distribution && 'developer-id' || 'adhoc' }}

jobs:
  matrix:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      hosts: ${{ steps.matrix.outputs.hosts }}
      backends: ${{ steps.matrix.outputs.backends }}
      linuxHosts: ${{ steps.matrix.outputs.linuxHosts }}
      appleHosts: ${{ steps.matrix.outputs.appleHosts }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: matrix
        run: bun run packages/release/scripts/matrix.ts
      - id: version
        shell: bash
        run: echo "version=$(jq -r '.version' packages/launcher/package.json)" >> "$GITHUB_OUTPUT"

  catalog:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: ./.github/actions/build-cache
        with:
          scope: catalog
      - run: bun install --frozen-lockfile
      - run: bun run icn:catalog:build-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-inputs
          path: inference/target/catalog-inputs/
          if-no-files-found: error

  host:
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.id == 'windows-x64-msvc' && inputs.windows_distribution && 'windows-signing' || startsWith(matrix.id, 'darwin-') && inputs.apple_distribution && 'apple-release' || 'release-validation' }}
    needs: [matrix, catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rustTarget }}
      - uses: ./.github/actions/build-cache
        with:
          scope: ${{ matrix.id }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev fakeroot rpm libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.id == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install Windows native build components
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $installation = & (Join-Path $installerRoot 'vswhere.exe') -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ Build Tools are required.' }
          $arguments = @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.Clang', '--add', 'Microsoft.VisualStudio.Component.VC.CMake.Project', '--quiet', '--norestart')
          $setup = Start-Process -FilePath (Join-Path $installerRoot 'setup.exe') -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -notin @(0, 3010)) { throw "Visual Studio component installation failed ($($setup.ExitCode))." }
          if (!(Test-Path (Join-Path $installation 'VC\Tools\Llvm\x64\bin\libclang.dll'))) { throw 'Visual Studio Clang installation is incomplete.' }
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-inputs
          path: catalog-inputs
      - name: Import Apple release credentials
        if: runner.os == 'macOS' && inputs.apple_distribution
        run: bash packages/release/scripts/apple/credentials.sh
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Build Unix host
        if: runner.os != 'Windows'
        run: bun run packages/release/scripts/build/host.ts "${{ matrix.id }}" catalog-inputs "release/${{ matrix.id }}"
      - name: Install Windows signing runtime
        if: runner.os == 'Windows' && inputs.windows_distribution
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Authenticate Windows Artifact Signing
        if: runner.os == 'Windows' && inputs.windows_distribution
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/release/scripts/build/windows.ps1 -CatalogDirectory catalog-inputs -OutputDirectory "release/${{ matrix.id }}"
        env:
          MAGNITUDE_WINDOWS_DISTRIBUTION: ${{ inputs.windows_distribution && 'artifact-signing' || 'unsigned' }}
          MAGNITUDE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error
      - name: Retain Apple notarization diagnostics
        if: always() && runner.os == 'macOS' && inputs.apple_distribution
        uses: actions/upload-artifact@v4
        with:
          name: apple-diagnostics-${{ matrix.id }}
          path: release/${{ matrix.id }}/.apple/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove temporary Apple credentials
        if: always() && runner.os == 'macOS' && inputs.apple_distribution
        run: bash packages/release/scripts/apple/cleanup-credentials.sh

  backend:
    environment: ${{ inputs.apple_distribution && 'apple-release' || 'release-validation' }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.backends) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: ./.github/actions/build-cache
        with:
          scope: ${{ matrix.id }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - name: Install Linux ARM64 compiler
        if: runner.os == 'Linux' && matrix.host == 'linux-arm64-gnu'
        run: |
          sudo apt-get install -y clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Cache Linux Vulkan tools
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk-1.4.313
          key: vulkan-tools-jammy-${{ runner.arch }}-headers-409c16be502e39fe70dd6fe2d9ad4842ef2c9a53-shaderc-e6edd6d48fa5bdd9d176794c6810fae7f8e938e1
      - name: Install Linux Vulkan tools
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        shell: bash
        run: |
          sudo apt-get install -y libvulkan-dev spirv-headers ninja-build python3
          vulkan_root="$RUNNER_TEMP/vulkan-sdk-1.4.313"
          if [ "${{ steps.vulkan-cache.outputs.cache-hit }}" != "true" ]; then
          headers_root="$RUNNER_TEMP/vulkan-headers-1.4.313"
          shaderc_root="$RUNNER_TEMP/shaderc-v2023.8"
          git clone --filter=blob:none https://github.com/google/shaderc.git "$shaderc_root"
          git -C "$shaderc_root" checkout --detach e6edd6d48fa5bdd9d176794c6810fae7f8e938e1
          python3 "$shaderc_root/utils/git-sync-deps"
          cmake \
            -S "$shaderc_root" \
            -B "$shaderc_root/build" \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D SHADERC_SKIP_TESTS=ON \
            -D SHADERC_SKIP_EXAMPLES=ON
          cmake --build "$shaderc_root/build" --target glslc_exe
          test -x "$shaderc_root/build/glslc/glslc"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Headers.git "$headers_root"
          git -C "$headers_root" checkout --detach 409c16be502e39fe70dd6fe2d9ad4842ef2c9a53
          cmake \
            -S "$headers_root" \
            -B "$headers_root/build" \
            -D CMAKE_INSTALL_PREFIX="$vulkan_root"
          cmake --build "$headers_root/build" --target install
          mkdir -p "$vulkan_root/bin"
          cp "$shaderc_root/build/glslc/glslc" "$vulkan_root/bin/glslc"
          fi
          "$vulkan_root/bin/glslc" --version
          test -f "$vulkan_root/include/vulkan/vulkan.hpp"
          echo "VULKAN_SDK=$vulkan_root" >> "$GITHUB_ENV"
          echo "$vulkan_root/bin" >> "$GITHUB_PATH"
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').VULKAN_SDK
          if (-not $sdk) { throw "Vulkan SDK installation did not publish VULKAN_SDK" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Use Ninja for Windows backend build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ninja --version
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: Install Linux CUDA toolkit
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) repository_arch=x86_64 ;;
            aarch64) repository_arch=sbsa ;;
            *) exit 1 ;;
          esac
          . /etc/os-release
          repository_distribution="ubuntu${VERSION_ID//./}"
          toolkit="${{ matrix.toolkit }}"
          package_version="${toolkit/./-}"
          curl --fail --location --silent --show-error \
            --output cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/${repository_distribution}/${repository_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-compiler-${package_version}" \
            "libcublas-dev-${package_version}"
          cuda_path="/usr/local/cuda-${toolkit}"
          test -x "${cuda_path}/bin/nvcc"
          test -x "${cuda_path}/bin/cuobjdump"
          test -f "${cuda_path}/include/cublas_v2.h"
          echo "CUDA_PATH=${cuda_path}" >> "$GITHUB_ENV"
          echo "${cuda_path}/bin" >> "$GITHUB_PATH"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          rm -f cuda-keyring.deb
      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        with:
          cuda: "${{ matrix.toolkit }}.0"
          method: network
      - run: bun install --frozen-lockfile
      - name: Import Apple release credentials
        if: runner.os == 'macOS' && inputs.apple_distribution
        run: bash packages/release/scripts/apple/credentials.sh
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - run: bun run packages/release/scripts/build/backend.ts "${{ matrix.id }}" "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error
      - name: Retain Apple notarization diagnostics
        if: always() && runner.os == 'macOS' && inputs.apple_distribution
        uses: actions/upload-artifact@v4
        with:
          name: apple-diagnostics-${{ matrix.id }}
          path: release/${{ matrix.id }}/.apple/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove temporary Apple credentials
        if: always() && runner.os == 'macOS' && inputs.apple_distribution
        run: bash packages/release/scripts/apple/cleanup-credentials.sh

  linux-consumer:
    needs: [matrix, host]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.linuxHosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y rpm xvfb dbus-x11 xfwm4 x11-utils xauth desktop-file-utils libglib2.0-bin
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}
      - run: bun run packages/release/scripts/validate-host.ts "${{ matrix.id }}" "release/${{ matrix.id }}"

      - name: Install the accepted DEB and exercise desktop ownership
        env:
          MAGNITUDE_TEST_CLI_EXECUTABLE: ${{ runner.temp }}/magnitude-release-cli/bin/magnitude-cli
        run: |
          set -- ./release/${{ matrix.id }}/*.deb
          test "$#" -eq 1
          sudo apt-get install -y --no-install-recommends "$1"
          mkdir -p "$RUNNER_TEMP/magnitude-release-cli"
          tar -xzf "release/${{ matrix.id }}/magnitude-cli-${{ matrix.id }}.tar.gz" -C "$RUNNER_TEMP/magnitude-release-cli"
          tar -xzf "release/${{ matrix.id }}/magnitude-acn-${{ matrix.id }}.tar.gz" -C "$RUNNER_TEMP/magnitude-release-cli"
          cmp "$RUNNER_TEMP/magnitude-release-cli/bin/magnitude-service" /usr/lib/magnitude-desktop/resources/magnitude-service
          xvfb-run -a dbus-run-session -- node desktop/src/fixtures/linux-installed-lifecycle.mjs

      - name: Install the accepted RPM in Fedora and exercise desktop ownership
        timeout-minutes: 15
        run: |
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          # Permit Chromium's own namespace sandbox without disabling container seccomp.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/moby/profiles/3c28324314729dbade8287e868eef6338c42807a/seccomp/default.json \
            -o "$RUNNER_TEMP/docker-seccomp.json"
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  $RUNNER_TEMP/docker-seccomp.json" | sha256sum --check
          jq '.syscalls += [{"names": ["clone", "setns", "unshare"], "action": "SCMP_ACT_ALLOW"}]' \
            "$RUNNER_TEMP/docker-seccomp.json" > "$RUNNER_TEMP/chromium-seccomp.json"
          docker run --rm --init \
            --security-opt "seccomp=$RUNNER_TEMP/chromium-seccomp.json" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/magnitude-release-cli:/accepted:ro" \
            -v "$node_root:/node:ro" \
            registry.fedoraproject.org/fedora:44 bash -euc '
              set -- /workspace/release/${{ matrix.id }}/*.rpm
              test "$#" -eq 1
              dnf install -y --setopt=install_weak_deps=False \
                --setopt=minrate=100000 --setopt=timeout=30 --setopt=max_parallel_downloads=10 "$1" \
                xorg-x11-server-Xvfb xorg-x11-xauth xprop dbus-daemon \
                xfwm4 desktop-file-utils shadow-utils diffutils
              cmp /accepted/bin/magnitude-service /usr/lib/magnitude-desktop/resources/magnitude-service
              test "$(stat -c "%u:%g:%a" /usr/lib/magnitude-desktop/chrome-sandbox)" = "0:0:4755"
              useradd --create-home magnitude-test
              runuser -u magnitude-test -- env PATH=/node/bin:/usr/bin:/bin \
                DEBUG=pw:browser \
                MAGNITUDE_TEST_CLI_EXECUTABLE=/accepted/bin/magnitude-cli \
                xvfb-run -a dbus-run-session -- node /workspace/desktop/src/fixtures/linux-installed-lifecycle.mjs
            '

  apple-consumer:
    needs: [matrix, host]
    environment: ${{ inputs.apple_distribution && 'apple-release' || 'release-validation' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.appleHosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}
      - run: bun run packages/release/scripts/validate-host.ts "${{ matrix.id }}" "release/${{ matrix.id }}"
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: apple-consumer-${{ matrix.id }}
          path: release/${{ matrix.id }}/apple-consumer.receipt.json
          if-no-files-found: error

  windows-consumer:
    needs: [matrix, host]
    environment: ${{ inputs.windows_distribution && 'windows-signing' || 'release-validation' }}
    runs-on: blacksmith-8vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: host-windows-x64-msvc
          path: release/windows-x64-msvc
      - run: bun run packages/release/scripts/validate-host.ts windows-x64-msvc release/windows-x64-msvc
      - name: Install and remove the accepted Windows application
        timeout-minutes: 10
        shell: pwsh
        run: ./packages/release/scripts/test-windows-installed.ps1 -Directory release/windows-x64-msvc -Version '${{ needs.matrix.outputs.version }}' -RequireSignature:([bool]::Parse('${{ inputs.windows_distribution }}'))
        env:
          MAGNITUDE_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}

  candidate:
    needs: [matrix, host, backend, linux-consumer, apple-consumer, windows-consumer]
    if: inputs.validate_candidate
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: sudo apt-get update && sudo apt-get install -y binutils rpm xvfb dbus-x11 xfwm4 x11-utils xauth desktop-file-utils libglib2.0-bin
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: release-artifacts
      - id: npm-candidate
        run: bun run packages/release/scripts/prepare-npm.ts release/npm-candidate
      - run: bun run packages/release/scripts/assemble.ts release-artifacts release-candidate
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.matrix.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      - run: bun run scripts/accept-release-candidate.ts release-candidate "${{ steps.npm-candidate.outputs.tarball }}"
