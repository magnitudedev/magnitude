name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: magnitude-production-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.preflight.outputs.action }}
      version: ${{ steps.preflight.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      hosts: ${{ steps.matrix.outputs.hosts }}
      backends: ${{ steps.matrix.outputs.backends }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the Changesets release commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_COMMIT: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: |
          commit="$EVENT_COMMIT"
          if [ -z "$commit" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            owner="${GITHUB_REPOSITORY%%/*}"
            commit="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state merged \
                --base main \
                --head changeset-release/main \
                --limit 100 \
                --json headRepositoryOwner,mergeCommit,mergedAt |
                jq -r \
                  --arg owner "$owner" \
                  'map(select(.headRepositoryOwner.login == $owner)) |
                    sort_by(.mergedAt) | last | .mergeCommit.oid // empty'
            )"
            test -n "$commit"
            current_version="$(jq -r '.version // empty' packages/cli/package.json)"
            release_version="$(
              git show "${commit}:packages/cli/package.json" |
                jq -r '.version // empty'
            )"
            test -n "$current_version"
            test "$release_version" = "$current_version"
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Validate the release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - id: preflight
        run: bun run packages/release/scripts/preflight.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate the preflight action
        shell: bash
        env:
          ACTION: ${{ steps.preflight.outputs.action }}
        run: |
          case "$ACTION" in
            release|publish-npm|complete) ;;
            *) echo "::error::Invalid preflight action: '${ACTION}'"; exit 1 ;;
          esac
      - id: matrix
        if: steps.preflight.outputs.action == 'release'
        run: bun run packages/release/scripts/matrix.ts

  catalog:
    needs: preflight
    if: needs.preflight.outputs.action == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run icn:catalog:hydrate
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-inputs
          path: inference/target/catalog-inputs/
          if-no-files-found: error

  host:
    needs: [preflight, catalog]
    if: needs.preflight.outputs.action == 'release'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rustTarget }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: catalog-inputs
          path: catalog-inputs
      - run: bun run packages/release/scripts/build/host.ts "${{ matrix.id }}" catalog-inputs "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  backend:
    needs: preflight
    if: needs.preflight.outputs.action == 'release'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.backends) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Install Linux Vulkan tools
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: sudo apt-get install -y libvulkan-dev glslc
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').VULKAN_SDK
          if (-not $sdk) { throw "Vulkan SDK installation did not publish VULKAN_SDK" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Install Linux CUDA toolkit
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) repository_arch=x86_64 ;;
            aarch64) repository_arch=sbsa ;;
            *) exit 1 ;;
          esac
          toolkit="${{ matrix.toolkit }}"
          package_version="${toolkit/./-}"
          curl --fail --location --silent --show-error \
            --output cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/${repository_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y "cuda-toolkit-${package_version}"
          echo "CUDA_PATH=/usr/local/cuda-${toolkit}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-${toolkit}/bin" >> "$GITHUB_PATH"
      - uses: Jimver/cuda-toolkit@v0.2.28
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        with:
          cuda: "${{ matrix.toolkit }}.0"
          method: network
      - run: bun install --frozen-lockfile
      - run: bun run packages/release/scripts/build/backend.ts "${{ matrix.id }}" "release/${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: release/${{ matrix.id }}/
          if-no-files-found: error

  publish:
    needs: [preflight, host, backend]
    if: needs.preflight.outputs.action == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: release-artifacts
      - run: npm install --global "npm@${NPM_VERSION}"
      - id: npm-candidate
        run: bun run packages/release/scripts/prepare-npm.ts release/npm-candidate
      - run: bun run packages/release/scripts/assemble.ts release-artifacts release-candidate
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      - run: bun run packages/release/scripts/accept-candidate.ts release-candidate "${{ steps.npm-candidate.outputs.tarball }}"
      - name: Commit-point recheck
        run: bun run packages/release/scripts/preflight.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MAGNITUDE_REQUIRE_RELEASE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun run packages/release/scripts/publish.ts release-candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      - name: Verify public CLI acquisition
        run: bun run packages/release/scripts/accept-public-cli.ts "${{ steps.npm-candidate.outputs.tarball }}"
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      - name: Publish npm through Changesets
        shell: bash
        run: |
          bun run publish -- --no-git-tag || true
          bun run packages/release/scripts/verify-npm.ts
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_EXPECTED_NPM_INTEGRITY: ${{ steps.npm-candidate.outputs.integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  public-smoke:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - shell: bash
        run: |
          npm install --global "@magnitudedev/cli@${{ needs.preflight.outputs.version }}"
          magnitude --version

  complete:
    needs: preflight
    if: needs.preflight.outputs.action == 'complete'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.preflight.outputs.version }} is already published"

  publish-npm:
    needs: preflight
    if: needs.preflight.outputs.action == 'publish-npm'
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      within_release: true
    secrets: inherit
