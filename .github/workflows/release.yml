name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main commit to release when retrying the current unpublished version
        required: false
        type: string

concurrency:
  group: magnitude-production-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.preflight.outputs.action }}
      version: ${{ steps.preflight.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      release_commit: ${{ steps.source.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the Changesets release commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_COMMIT: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          SOURCE_COMMIT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || '' }}
        run: |
          release_commit="$EVENT_COMMIT"
          if [ -z "$release_commit" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            owner="${GITHUB_REPOSITORY%%/*}"
            release_commit="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state merged \
                --base main \
                --head changeset-release/main \
                --limit 100 \
                --json headRepositoryOwner,mergeCommit,mergedAt |
                jq -r \
                  --arg owner "$owner" \
                  'map(select(.headRepositoryOwner.login == $owner)) |
                    sort_by(.mergedAt) | last | .mergeCommit.oid // empty'
            )"
            test -n "$release_commit"
            current_version="$(jq -r '.version // empty' packages/launcher/package.json)"
            release_version="$(
              git show "${release_commit}:packages/launcher/package.json" |
                jq -r '.version // empty'
            )"
            test -n "$current_version"
            test "$release_version" = "$current_version"
          fi
          commit="${SOURCE_COMMIT_OVERRIDE:-$release_commit}"
          [[ "$release_commit" =~ ^[a-f0-9]{40}$ ]]
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$release_commit" "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          source_version="$(
            git show "${commit}:packages/launcher/package.json" |
              jq -r '.version // empty'
          )"
          test -n "$source_version"
          test "$source_version" = "$(
            git show "${release_commit}:packages/launcher/package.json" |
              jq -r '.version // empty'
          )"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Validate the release commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - id: preflight
        run: bun run packages/release/scripts/preflight.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          MAGNITUDE_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate the preflight action
        shell: bash
        env:
          ACTION: ${{ steps.preflight.outputs.action }}
        run: |
          case "$ACTION" in
            release|publish-npm|complete) ;;
            *) echo "::error::Invalid preflight action: '${ACTION}'"; exit 1 ;;
          esac
  build:
    needs: preflight
    if: needs.preflight.outputs.action == 'release'
    uses: ./.github/workflows/release-build.yml
    with:
      source_commit: ${{ needs.preflight.outputs.source_commit }}
      validate_candidate: false

  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.action == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y binutils
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: release-artifacts
      - run: npm install --global "npm@${NPM_VERSION}"
      - id: npm-candidate
        run: bun run packages/release/scripts/prepare-npm.ts release/npm-candidate
      - run: bun run packages/release/scripts/assemble.ts release-artifacts release-candidate
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      - run: bun run scripts/accept-release-candidate.ts release-candidate "${{ steps.npm-candidate.outputs.tarball }}"
      - name: Commit-point recheck
        run: bun run packages/release/scripts/preflight.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MAGNITUDE_REQUIRE_RELEASE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun scripts/accept-integrations.ts
      - run: bun scripts/publish-integrations.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun run packages/release/scripts/publish.ts release-candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGNITUDE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
      - name: Verify public CLI acquisition
        run: bun run packages/release/scripts/accept-public-cli.ts "${{ steps.npm-candidate.outputs.tarball }}"
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      - name: Publish npm through Changesets
        shell: bash
        run: |
          bun run publish -- --no-git-tag || true
          bun run packages/release/scripts/verify-npm.ts
        env:
          MAGNITUDE_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MAGNITUDE_EXPECTED_NPM_INTEGRITY: ${{ steps.npm-candidate.outputs.integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  public-smoke:
    needs: [preflight, publish]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - shell: bash
        run: |
          npm install --global "@magnitudedev/cli@${{ needs.preflight.outputs.version }}"
          magnitude --version

  complete:
    needs: preflight
    if: needs.preflight.outputs.action == 'complete'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.preflight.outputs.version }} is already published"

  publish-npm:
    needs: preflight
    if: needs.preflight.outputs.action == 'publish-npm'
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      within_release: true
    secrets: inherit
