name: Docker tags

# Publishes the digests docker-image.yml pushed and smoke-tested earlier in this run as one
# multi-arch manifest under the release's tags. It builds nothing, so the release calls it only
# after publication, and re-running it is safe.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: Commit whose scripts compute the tags
        required: true
        type: string
      repository:
        required: true
        type: string
      channel_tag:
        required: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  REPOSITORY: ${{ inputs.repository }}
  DOCKERHUB_USERNAME: magnitudedev

jobs:
  manifest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish the multi-arch manifest under the release's tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL_TAG: ${{ inputs.channel_tag }}
        run: |
          mapfile -t tags < <(bun packages/release/scripts/docker/tags.ts "docker.io/$REPOSITORY" "$VERSION")
          test "${#tags[@]}" -eq 2
          test "$CHANNEL_TAG" = true || tags=("${tags[0]}")
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do sources+=("docker.io/$REPOSITORY@sha256:$(basename "$file")"); done
          test "${#sources[@]}" -eq 2
          arguments=()
          for tag in "${tags[@]}"; do arguments+=(--tag "$tag"); done
          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          test "$(docker buildx imagetools inspect --raw "${tags[0]}" | jq -r .mediaType)" = application/vnd.docker.distribution.manifest.list.v2+json
