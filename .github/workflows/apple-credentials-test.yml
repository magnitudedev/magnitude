name: Apple credentials test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-credentials-test
  cancel-in-progress: false

jobs:
  sign-and-notarize:
    environment: apple-release
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Import signing and notarization credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPLE_TEAM_ID:?}" "${APPLE_SIGNING_IDENTITY:?}"
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?}" "${APPLE_DEVELOPER_ID_P12_PASSWORD:?}"
          : "${APPLE_NOTARY_API_KEY_P8:?}" "${APPLE_NOTARY_KEY_ID:?}" "${APPLE_NOTARY_ISSUER_ID:?}"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          credentials="$(mktemp -d "$RUNNER_TEMP/apple-credentials.XXXXXX")"
          echo "CANARY_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
          keychain="$credentials/signing.keychain-db"
          echo "CANARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          trap 'rm -f "$credentials/signing.p12" "$credentials/notary.p8"' EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$credentials/signing.p12"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8" > "$credentials/notary.p8"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$credentials/signing.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$credentials/DeveloperIDG2CA.cer"
          security import "$credentials/DeveloperIDG2CA.cer" -k "$keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials apple-credentials-test --keychain "$keychain" \
            --key "$credentials/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" > /dev/null

      - name: Verify the imported signing identity
        run: |
          set -euo pipefail
          if ! security find-certificate -c "$APPLE_SIGNING_IDENTITY" "$CANARY_KEYCHAIN" > /dev/null; then
            echo "::error::The P12 does not contain the certificate named by APPLE_SIGNING_IDENTITY."
            exit 1
          fi
          identities="$(security find-identity -v -p codesigning "$CANARY_KEYCHAIN")"
          printf '%s\n' "$identities"
          if ! grep -Fq "\"$APPLE_SIGNING_IDENTITY\"" <<< "$identities"; then
            security find-identity -p codesigning "$CANARY_KEYCHAIN"
            echo "::error::The certificate was imported but has no valid signing identity. Check that the P12 includes its matching private key and that the certificate is valid."
            exit 1
          fi

      - name: Build and sign a sample macOS app
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/apple-canary"
          app="$root/AppleCredentialsTest.app"
          mkdir -p "$app/Contents/MacOS" "$root/diagnostics" "$root/artifacts"
          cat > "$root/main.swift" <<'SWIFT'
          import AppKit
          let app = NSApplication.shared
          app.setActivationPolicy(.regular)
          let menu = NSMenu()
          let item = NSMenuItem()
          menu.addItem(item)
          let submenu = NSMenu()
          submenu.addItem(withTitle: "Quit", action: #selector(NSApplication.terminate(_:)), keyEquivalent: "q")
          item.submenu = submenu
          app.mainMenu = menu
          let window = NSWindow(contentRect: NSRect(x: 0, y: 0, width: 420, height: 120), styleMask: [.titled, .closable], backing: .buffered, defer: false)
          window.title = "Apple credentials test"
          let label = NSTextField(labelWithString: "Signing test only — this is not Magnitude.")
          label.frame = NSRect(x: 20, y: 45, width: 380, height: 25)
          window.contentView?.addSubview(label)
          window.center()
          window.makeKeyAndOrderFront(nil)
          app.activate(ignoringOtherApps: true)
          app.run()
          SWIFT
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>AppleCredentialsTest</string>
            <key>CFBundleIdentifier</key><string>dev.magnitude.apple-credentials-test</string>
            <key>CFBundleName</key><string>Apple credentials test</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          xcrun swiftc -target "$(uname -m)-apple-macosx13.0" "$root/main.swift" -o "$app/Contents/MacOS/AppleCredentialsTest"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$CANARY_KEYCHAIN" --timestamp --options runtime "$app"
          codesign --verify --deep --strict -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" "$app"
          ditto -c -k --keepParent "$app" "$root/submission.zip"

      - name: Submit to Apple, staple, and verify
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/apple-canary"
          app="$root/AppleCredentialsTest.app"
          result="$root/diagnostics/notary.json"
          status=0
          xcrun notarytool submit "$root/submission.zip" --keychain-profile apple-credentials-test \
            --keychain "$CANARY_KEYCHAIN" --wait --timeout 30m --output-format json > "$result" || status=$?
          if [ "$status" -ne 0 ] || ! jq -e '.status == "Accepted"' "$result" > /dev/null; then
            submission="$(jq -r '.id // empty' "$result" 2>/dev/null || true)"
            if [ -n "$submission" ]; then
              xcrun notarytool log "$submission" --keychain-profile apple-credentials-test \
                --keychain "$CANARY_KEYCHAIN" "$root/diagnostics/notary.log.json" || true
            fi
            cat "$result"
            echo "::error::Apple did not accept the submission. See apple-credentials-diagnostics."
            exit 1
          fi
          xcrun stapler staple "$app"
          ditto -c -k --keepParent "$app" "$root/artifacts/AppleCredentialsTest.zip"
          ditto -x -k "$root/artifacts/AppleCredentialsTest.zip" "$root/extracted"
          codesign --verify --deep --strict -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" "$root/extracted/AppleCredentialsTest.app"
          xcrun stapler validate "$root/extracted/AppleCredentialsTest.app"
          echo 'Apple credentials passed: sample app signed, notarized, stapled, and verified after extraction. This does not test Magnitude or publish a release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: |
          if [ -n "${CANARY_CREDENTIALS:-}" ]; then
            if [ -f "$CANARY_KEYCHAIN" ]; then
              security delete-keychain "$CANARY_KEYCHAIN"
            fi
            rm -rf "$CANARY_CREDENTIALS"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apple-credentials-sample-app
          path: ${{ runner.temp }}/apple-canary/artifacts/AppleCredentialsTest.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-credentials-diagnostics
          path: ${{ runner.temp }}/apple-canary/diagnostics/
          retention-days: 7
          if-no-files-found: ignore
