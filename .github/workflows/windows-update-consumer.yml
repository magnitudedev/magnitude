name: Installed Windows update acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful producer run containing prepared-windows-installers
        required: true
        default: '34751651548'
        type: string
      from_version:
        description: Installer version to start from
        required: true
        default: '0.0.32'
        type: string
      to_version:
        description: Hosted update version to accept
        required: true
        default: '0.0.33'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-update-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-application:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MAGNITUDE_WINDOWS_ACCEPTANCE_FROM: ${{ inputs.from_version }}
      MAGNITUDE_WINDOWS_ACCEPTANCE_TO: ${{ inputs.to_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Reuse the previously signed and transfer-verified installer cohort
        uses: actions/download-artifact@v4
        with:
          name: prepared-windows-installers
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/magnitude-windows-update-acceptance
      - name: Exercise real downloads, Settings, native replacement and tray interaction
        shell: pwsh
        run: ./packages/release/scripts/acceptance/test-windows-hosted-update.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-update-evidence
          path: ${{ runner.temp }}/magnitude-windows-update-acceptance/consumer
          if-no-files-found: warn
          retention-days: 14
