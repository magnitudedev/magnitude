name: Changesets

on:
  push:
    branches: [main]

concurrency:
  group: changesets-version-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.6.2
      - id: derived
        name: Detect RPC and bundled plugin changes before Changesets discovery
        run: bun packages/release/scripts/prepare-release.ts --detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: changesets/action@v1
        if: steps.derived.outputs.pending != 'true'
        with:
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
