name: Docker image

# Builds the image of a published release from its own .deb and engine, natively per
# architecture, pushes each by digest (untagged), smoke-tests exactly that digest, then publishes
# one multi-arch manifest under the release's tags. Called by the release after publication; dispatch it to rebuild a
# published version or to push to another repository, such as magnitudedev/magnitude-qa.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        description: Commit whose Dockerfile and scripts build the image
        required: true
        type: string
      repository:
        required: false
        type: string
        default: magnitudedev/magnitude
      channel_tag:
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Exact published release version
        required: true
        type: string
      ref:
        description: Commit whose Dockerfile and scripts build the image; empty for the dispatched one
        required: false
        type: string
      repository:
        description: Docker Hub repository
        required: false
        type: string
        default: magnitudedev/magnitude
      channel_tag:
        description: Also move latest, beta or alpha; leave off when rebuilding an older release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  REPOSITORY: ${{ inputs.repository || 'magnitudedev/magnitude' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-8vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Only main publishes the official repository
        if: env.REPOSITORY == 'magnitudedev/magnitude'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Prepare the build context from the release
        run: >-
          bun packages/release/scripts/docker/prepare-context.ts
          --version "$VERSION" --arch "${{ matrix.arch }}" --output "$RUNNER_TEMP/context"
        env:
          VERSION: ${{ inputs.version }}
      # Docker media types without attestations: Podman reads HEALTHCHECK only from a Docker image config.
      - name: Build and push by digest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          revision=$(jq -r .sourceCommit "$RUNNER_TEMP/context/magnitude-release.json")
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --file packaging/docker/Dockerfile \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$revision" \
            --provenance=false --sbom=false \
            --output "type=image,name=docker.io/$REPOSITORY,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            "$RUNNER_TEMP/context"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          echo "IMAGE=docker.io/$REPOSITORY@$digest" >> "$GITHUB_ENV"
          echo "Pushed linux/${{ matrix.arch }} as docker.io/$REPOSITORY@$digest"
      # The digest stays untagged, and so unpublished, unless this passes.
      - name: Smoke test the pushed digest
        timeout-minutes: 45
        env:
          VERSION: ${{ inputs.version }}
        run: bash packages/release/scripts/acceptance/test-docker.sh "$IMAGE" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  manifest:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish the multi-arch manifest under the release's tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL_TAG: ${{ inputs.channel_tag }}
        run: |
          mapfile -t tags < <(bun packages/release/scripts/docker/tags.ts "docker.io/$REPOSITORY" "$VERSION")
          test "${#tags[@]}" -eq 2
          test "$CHANNEL_TAG" = true || tags=("${tags[0]}")
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do sources+=("docker.io/$REPOSITORY@sha256:$(basename "$file")"); done
          test "${#sources[@]}" -eq 2
          arguments=()
          for tag in "${tags[@]}"; do arguments+=(--tag "$tag"); done
          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          test "$(docker buildx imagetools inspect --raw "${tags[0]}" | jq -r .mediaType)" = application/vnd.docker.distribution.manifest.list.v2+json
