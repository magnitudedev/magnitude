name: Release checks

on:
  workflow_dispatch:
    inputs:
      intel_installer_only:
        description: Exercise the signed Intel Mac installer and CPU inference from the existing audit artifacts
        type: boolean
        default: false
      windows_fixture_only:
        description: Build only the timestamped Windows installer fixture, reusing the existing native engine for tests
        type: boolean
        default: false
      macos_cpu_artifact_run_id:
        description: Test Intel CPU inference using this existing release run (no builds or publication)
        type: string
        default: ''
      macos_cpu_model:
        description: Shipped catalog model for Intel CPU inference acceptance
        type: choice
        options:
          - 'qwen3.5-4b:gguf:q4'
        default: 'qwen3.5-4b:gguf:q4'
      windows_distribution:
        description: Validate Azure-signed Windows artifacts without publishing
        type: boolean
        default: false
  pull_request:
    paths:
      - ".changeset/**"
      - ".github/workflows/**"
      - "cli/**"
      - "inference/**"
      - "packages/**"
      - "patches/**"
      - "scripts/accept-release-candidate.ts"
      - "scripts/release-target.ts"
      - "scripts/tsconfig.release.json"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  RUST_VERSION: "1.91.1"
  NPM_VERSION: "11.6.2"

jobs:
  macos-cpu-inference:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_cpu_artifact_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-inference-macos.yml
    with:
      artifact_run_id: ${{ inputs.macos_cpu_artifact_run_id }}
      model: ${{ inputs.macos_cpu_model }}

  integrations:
    if: ${{ !inputs.macos_cpu_artifact_run_id && !inputs.windows_fixture_only && !inputs.intel_installer_only }}
    uses: ./.github/workflows/integrations.yml

  static:
    if: ${{ !inputs.macos_cpu_artifact_run_id && !inputs.windows_fixture_only && !inputs.intel_installer_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: ./.github/actions/build-cache
        with:
          scope: static
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - run: bun run icn:check-generated
      - run: bun run --cwd packages/icn-protocol typecheck
      - run: bun run --cwd packages/icn-protocol test
      - run: bun run --cwd packages/release typecheck
      - run: bun run --cwd cli typecheck
      - run: bun run --cwd packages/sdk typecheck
      - run: bun run --cwd packages/icn typecheck
      - run: bun run --cwd packages/ripgrep prepare
      - run: bun run --cwd packages/acn typecheck
      - run: bunx tsc -p scripts/tsconfig.release.json
      - run: bun run packages/release/scripts/matrix.ts

  release-build:
    if: ${{ !inputs.macos_cpu_artifact_run_id && !inputs.windows_fixture_only && !inputs.intel_installer_only }}
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: [static, integrations]
    uses: ./.github/workflows/release-build.yml
    with:
      source_commit: ${{ github.sha }}
      validate_candidate: true
      windows_distribution: false
      apple_distribution: true
    secrets: inherit

  windows-script-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_fixture_only
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Prepare timestamped disposable publisher fixture
        shell: pwsh
        run: |
          . ./packages/release/scripts/build/windows-engine-toolchain.ps1
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $fixture = Join-Path $env:RUNNER_TEMP 'installer-audit'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Magnitude Update Acceptance, O=Magnitude Update Acceptance' -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
          $cer = Join-Path $fixture 'acceptance-publisher.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $nodeVersion = (& node.exe -p process.versions.node).Trim()
          $library = Join-Path $fixture 'node.lib'
          Invoke-WebRequest "https://nodejs.org/download/release/v$nodeVersion/win-x64/node.lib" -OutFile $library
          $env:MAGNITUDE_NODE_LIBRARY = $library
          $env:MAGNITUDE_SCRIPT_ACCEPTANCE_OUTPUT = $fixture
          $env:MAGNITUDE_ACCEPTANCE_WINDOWS_CERTIFICATE = $cert.Thumbprint
          $env:MAGNITUDE_ACCEPTANCE_TIMESTAMP_SERVER = 'http://timestamp.digicert.com'
          $env:MAGNITUDE_ACCEPTANCE_NSIS = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          bun packages/release/scripts/acceptance/prepare-windows-script-fixture.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows script fixture build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-fixture-windows-x64-msvc
          path: |
            ${{ runner.temp }}/installer-audit/hosting/
            ${{ runner.temp }}/installer-audit/acceptance-publisher.cer
          if-no-files-found: error

  intel-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.intel_installer_only
    runs-on: macos-15-large
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: host-darwin-x64
          path: native
          run-id: 40220873374
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: installer-fixture-darwin-x64
          path: fixture
          run-id: 40220873374
          github-token: ${{ github.token }}
      - name: Prepare disposable local installer and engine feeds
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib,json,shutil
          root=pathlib.Path.home()/'installer-audit-next';root.mkdir(mode=0o700)
          fixture=pathlib.Path('fixture');hosting=fixture/'hosting' if (fixture/'hosting').exists() else fixture
          shutil.copytree(hosting,root/'hosting')
          helpers=root/'helpers';helpers.mkdir()
          for name in ['installer-audit-mac-check.sh','installer-audit-unix-runtime.py','installer-audit-unix-api.py']:
            shutil.copy2(pathlib.Path('scripts')/name,helpers/name)
          artifacts=[json.loads(p.read_text()) for p in pathlib.Path('native').glob('*.artifact.json')]
          plan=json.loads(pathlib.Path('packages/release/release-plan.json').read_text())
          release=root/'release/@magnitudedev/cli@0.2.10';release.mkdir(parents=True)
          manifest={'schemaVersion':2,'version':'0.2.10','acnRevision':plan['revision'],'tag':'@magnitudedev/cli@0.2.10','sourceCommit':'c344259558f95dbfdbb643c1b559a2ca126f9332','rpc':plan['rpc'],'plugins':[],'artifacts':artifacts}
          (release/'magnitude-release.json').write_text(json.dumps(manifest))
          engine=next(a for a in artifacts if a['id']=='icn-base-darwin-x64')
          shutil.copy2(pathlib.Path('native')/engine['filename'],release/engine['filename'])
          (root/'tls.conf').write_text('[req]\ndistinguished_name=subject\nx509_extensions=extensions\nprompt=no\n[subject]\nCN=localhost\n[extensions]\nsubjectAltName=DNS:localhost,DNS:github.com\n')
          PYTHON
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$HOME/installer-audit-next/tls.conf" -keyout "$HOME/installer-audit-next/fixture-tls.key" -out "$HOME/installer-audit-next/fixture-tls.crt"
      - name: Run the unchanged signed installer and real CPU API acceptance
        run: |
          uv run --project inference/evaluation --package magnitude-rig mrig setup local
          uv run --project inference/evaluation --package magnitude-rig mrig script scripts/installer-audit-intel.sh --host local --backend cpu --purpose 'Qualify native Intel macOS15 curl installer, cold engine acquisition, current CLI, final response and streaming from the exact built archives' --estimate 8m
          grep -q 'RESULT=next-complete-answer-and-streaming-passed' "$HOME/installer-audit-next/acceptance-api.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-installer-acceptance
          path: |
            /Users/runner/installer-audit-next/*.log
            /Users/runner/installer-audit-next/*.json
            inference/evaluation/results/
          if-no-files-found: warn
