[package]
name = "seismic-threads"
version.workspace = true
edition.workspace = true
license.workspace = true

# The threads this process may run at once (its share of the machine, which
# every thread pool of the process sizes itself by), and every thread and
# runtime worker the process starts, with the stack they run on.
[dependencies]
tokio = { workspace = true, optional = true }

[features]
# `runtime`: a Tokio runtime whose threads are the owner's.
tokio = ["dep:tokio"]
