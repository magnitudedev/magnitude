[package]
name = "seismic-topology"
version.workspace = true
edition.workspace = true
license.workspace = true

# What the machine is: the device topology, its discovery through the backend
# crates and the OS, and status samples (specs/26-10-18/device-topology.md).
[dependencies]
seismic-lang.workspace = true
seismic-cpu.workspace = true
seismic-native-cpu.workspace = true
seismic-cuda.workspace = true
seismic-metal.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Vulkan is built on Linux and Windows only.
[target.'cfg(not(target_os = "macos"))'.dependencies]
seismic-vulkan.workspace = true

# Recorded Vulkan reports take the backend's own allocation rule on every
# host, so on macOS the recorded machines bring the backend crate in.
[target.'cfg(target_os = "macos")'.dependencies]
seismic-vulkan = { workspace = true, optional = true }

[dev-dependencies]
# The recorded machines of this crate's own tests.
seismic-vulkan.workspace = true

[features]
# The recorded machines (`fixtures::recorded`), for other crates' tests.
fixtures = ["dep:seismic-vulkan"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }
