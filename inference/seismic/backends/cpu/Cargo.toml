[package]
name = "seismic-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seismic-topology.workspace = true
seismic-ir.workspace = true
seismic-estimator.workspace = true
seismic-lang.workspace = true
seismic-native-target.workspace = true
seismic-compiler.workspace = true
seismic-memory.workspace = true
seismic-threads.workspace = true
sha2 = "=0.11.0"
libc = "0.2"
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
cranelift-native = "=0.125.4"
cranelift-reader = "=0.125.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[build-dependencies]
# The formation build identity (`toolchain::FORMATION_BUILD`).
magnitude-source-identity = { path = "../../../engine/source-identity" }

[dev-dependencies]
# The recorded machines, whose CPU reports the backend is held to.
seismic-topology = { workspace = true, features = ["fixtures"] }
