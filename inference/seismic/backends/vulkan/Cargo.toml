[package]
name = "seismic-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Vulkan backend of Seismic's direct native route. It is built on Linux
# and Windows only; dependents gate it with `cfg(not(target_os = "macos"))`.
[dependencies]
seismic-topology.workspace = true
seismic-compiler.workspace = true
seismic-memory.workspace = true
seismic-lang.workspace = true
seismic-native-target.workspace = true
ash = "=0.38.0"
glslang = "=0.8.1"
spirv-tools = "=0.13.3"

[dev-dependencies]
# The recorded devices, whose heaps and memory types the backend is held to.
seismic-topology = { workspace = true, features = ["fixtures"] }

[build-dependencies]
# The formation build identity (`toolchain::FORMATION_BUILD`).
magnitude-source-identity = { path = "../../../engine/source-identity" }

[lints]
workspace = true
