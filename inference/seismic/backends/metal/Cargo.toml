[package]
name = "seismic-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seismic-estimator-metal.workspace = true
seismic-ir.workspace = true
seismic-estimator.workspace = true
seismic-lang.workspace = true
seismic-native-target.workspace = true
seismic-compiler.workspace = true
sha2 = "=0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Unoptimized builds otherwise check every message send against the runtime's
# type encoding; the generated Metal bindings are correct by construction.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSObject", "NSRange", "NSProcessInfo", "NSData"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder", "MTLComputePipeline", "MTLBuffer", "MTLResource", "MTLTypes", "MTLAllocation", "MTLResidencySet", "MTLPipeline", "MTLCounters", "MTLComputePass", "objc2-core-foundation", "block2"] }
libc = "0.2"
