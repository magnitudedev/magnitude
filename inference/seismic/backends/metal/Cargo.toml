[package]
name = "seismic-metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seismic-topology.workspace = true
seismic-estimator-metal.workspace = true
seismic-ir.workspace = true
seismic-estimator.workspace = true
seismic-lang.workspace = true
seismic-native-target.workspace = true
seismic-compiler.workspace = true
# The ledger entries allocations are charged to.
seismic-memory.workspace = true
sha2 = "=0.11.0"
# Probe answers, kept in the program store.
serde.workspace = true
serde_json.workspace = true
# Probe answers that could not be kept are reported.
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Unoptimized builds otherwise check every message send against the runtime's
# type encoding; the generated Metal bindings are correct by construction.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSObject", "NSRange", "NSProcessInfo", "NSData", "NSURL"] }
objc2-metal = { version = "0.3", features = ["MTLBinaryArchive", "MTLDevice", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder", "MTLComputePipeline", "MTLBuffer", "MTLResource", "MTLTypes", "MTLAllocation", "MTLResidencySet", "MTLPipeline", "MTLCounters", "MTLComputePass", "MTLEvent", "MTLFence", "objc2-core-foundation", "block2"] }
libc = "0.2"
block2 = "0.6"

[build-dependencies]
# The formation build identity (`toolchain::FORMATION_BUILD`).
magnitude-source-identity = { path = "../../../engine/source-identity" }
