[workspace]
resolver = "2"
members = [
  "solver",
  "solver/lab",
  "engine",
  "engine/artifacts",
  "engine/chat",
  "engine/generation",
  "engine/grammar",
  "engine/scheduler",
  "engine/batching",
  "engine/families/contracts",
  "engine/families/common",
  "engine/executor",
  "engine/kernels",
  "engine/state",
  "engine/families/qwen35",
  "engine/families/muse_glimmer",
  "engine/families/gemma4",
  "engine/families/llama",
  "engine/families/lfm2",
  "engine/families/nemotron_h",
  "engine/families/dflash",
  "engine/templates",
  "engine/serving",
  "engine/cli",
  "service/contracts",
  "service/utils",
  "service/models",
  "service/catalog-tool",
  "service/api",
  "service/server",
  "seismic-std",
  "seismic/lang",
  "seismic/ir",
  "seismic/native-target",
  "seismic/native-cpu",
  "seismic/estimator/core",
  "seismic/estimator/metal",
  "seismic/backends/metal",
  "seismic/backends/cpu",
  "seismic/backends/cuda",
  "seismic/backends/vulkan",
  "seismic/cli",
  "seismic/compiler",
  "seismic/runtime",
  "seismic/api",
  "seismic/build",
  "seismic/corpus",
  "seismic/native-tests",
  "seismic/frontends/python",
]
default-members = [
  "solver",
  "solver/lab",
  "engine",
  "engine/templates",
  "engine/serving",
  "engine/cli",
  "service/contracts",
  "service/utils",
  "service/models",
  "service/catalog-tool",
  "service/api",
  "service/server",
  "seismic-std",
  "seismic/lang",
  "seismic/ir",
  "seismic/native-target",
  "seismic/native-cpu",
  "seismic/estimator/core",
  "seismic/estimator/metal",
  "seismic/backends/metal",
  "seismic/backends/cpu",
  "seismic/backends/cuda",
  "seismic/cli",
  "seismic/compiler",
  "seismic/runtime",
  "seismic/api",
  "seismic/build",
  "seismic/corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
seismic-estimator-metal = { path = "seismic/estimator/metal" }
seismic-ir = { path = "seismic/ir" }
seismic-native-target = { path = "seismic/native-target" }
seismic-native-cpu = { path = "seismic/native-cpu" }
seismic-estimator = { path = "seismic/estimator/core" }
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
seismic-std = { path = "seismic-std" }
seismic-lang = { path = "seismic/lang" }
seismic-metal = { path = "seismic/backends/metal" }
seismic-cpu = { path = "seismic/backends/cpu" }
seismic-cuda = { path = "seismic/backends/cuda" }
seismic-vulkan = { path = "seismic/backends/vulkan" }
seismic-compiler = { path = "seismic/compiler" }
seismic-runtime = { path = "seismic/runtime" }
seismic = { path = "seismic/api" }
seismic-build = { path = "seismic/build" }
magnitude-service-contracts = { path = "service/contracts" }
magnitude-service-utils = { path = "service/utils" }
magnitude-service-models = { path = "service/models" }
anyhow = "1.0.100"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
flate2 = "1.1"
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.4.3"
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
http-body-util = "0.1.3"
libc = "0.2.180"
opentelemetry = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-json", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "trace"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
same-file = "1.0.6"
serde_json = "1.0.149"
sha2 = "0.10.9"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.24"
utoipa = { version = "5.4.0", features = ["axum_extras", "preserve_order"] }

[profile.dev]
debug = "line-tables-only"

# CPU native kernels compile into the crates below; unoptimized, they are
# unusable even in tests. The generic Seismic CPU library code is
# instantiated in the kernel crate, so its level is the kernel crate's.
[profile.dev.package.magnitude-kernels]
opt-level = 3

[profile.dev.package.seismic-native-cpu]
opt-level = 3

[profile.dev.package.seismic-native-tests]
opt-level = 3

[profile.release]
debug = 1
