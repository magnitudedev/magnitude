[package]
name = "magnitude-family-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The catalog header loader for family tests.
catalog-headers = ["dep:serde_json"]

[dependencies]
magnitude-artifacts = { path = "../../artifacts" }
magnitude-family-contracts = { path = "../contracts" }
# Header floats parse to the values GGUF stores, whatever else the build unifies.
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }

[dev-dependencies]
magnitude-family-common = { path = ".", features = ["catalog-headers"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
magnitude-family-dflash = { path = "../dflash" }
magnitude-family-registry = { path = "../registry" }
# The worker wire's encoding, which every built definition crosses (`tests/catalog_definitions.rs`).
postcard.workspace = true
flate2.workspace = true
