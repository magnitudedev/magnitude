[package]
name = "magnitude-engine-cli"
version.workspace = true
edition = "2024"
license.workspace = true

# The low-level `magnitude-engine` binary: one explicit local model, loaded
# in-process, served through the engine's protocol library.
[[bin]]
name = "magnitude-engine"
path = "src/main.rs"

# Host-only tokenizer and chat-template metadata; never opens an execution device.
[[bin]]
name = "magnitude-count"
path = "src/count.rs"

[dependencies]
magnitude-artifacts = { path = "../artifacts" }
magnitude-chat = { path = "../chat" }
axum = "0.8.9"
futures-util.workspace = true
magnitude-engine = { path = ".." }
magnitude-executor = { path = "../executor" }
magnitude-serving = { path = "../serving" }
magnitude-state = { path = "../state" }
seismic.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
tracing-subscriber.workspace = true
