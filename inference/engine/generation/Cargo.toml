[package]
name = "magnitude-generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
magnitude-artifacts = { path = "../artifacts" }
magnitude-executor = { path = "../executor" }
# The regular-language engine of the llguidance version that consumes the
# converted grammars, for proving lexical compilation language-preserving.
derivre = { version = "=0.3.12", default-features = false, features = ["compress", "ahash"] }
serde.workspace = true
serde_json = "=1.0.151"
