[package]
name = "magnitude-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
magnitude-artifacts = { path = "../artifacts" }
magnitude-batching = { path = "../batching" }
magnitude-family-contracts = { path = "../families/contracts" }
magnitude-kernels = { path = "../kernels" }
magnitude-state = { path = "../state" }
seismic.workspace = true
serde.workspace = true
# Persisted precision policies and objective weights retain their exact f64 identity.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"

[features]
# Explicit two-CUDA execution; never selected by catalog or default policy.
experimental-pipeline-cuda = []
# Development-only partial-step lifecycle qualification; absent from normal builds.
pipeline-fault-injection = ["experimental-pipeline-cuda"]
# Development-only bounded precision calibration; production uses fixed limits.
tuning-precision-experiment = []
# Development-only tuning pin for bit-exact measurement runs
# (`native::tuning::pinned`). Enabled only through `magnitude-engine`'s
# `pinned-tuning` feature by the `forward_bench` example; never by a served
# engine.
pinned-tuning = []
# Development-only tuning survey (`native::tuning::survey`): every admissible
# configuration of every tuned entry is measured and recorded for replaying
# the search. Enabled only through `magnitude-engine`'s `tuning-survey`
# feature by `forward_bench`; never by a served engine.
tuning-survey = []

# The catalog's families and headers, for the assessment terms of every
# catalog target (`assessment::catalog`).
[dev-dependencies]
magnitude-family-common = { path = "../families/common", features = ["catalog-headers"] }
magnitude-family-dflash = { path = "../families/dflash" }
magnitude-family-gemma4 = { path = "../families/gemma4" }
magnitude-family-lfm2 = { path = "../families/lfm2" }
magnitude-family-llama = { path = "../families/llama" }
magnitude-family-muse-glimmer = { path = "../families/muse_glimmer" }
magnitude-family-nemotron-h = { path = "../families/nemotron_h" }
magnitude-family-qwen35 = { path = "../families/qwen35" }

# Development-only: replays the tuning search against survey records.
[[example]]
name = "tuning_replay"
required-features = ["tuning-survey"]
