[package]
name = "magnitude-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Equality of header values (`gguf::Value`, `Directory`, ...), which decodes array payloads: for
# tests.
equality = []

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
magnitude-ggml.workspace = true
seismic-io.workspace = true
serde = { workspace = true, features = ["rc"] }
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
magnitude-artifacts = { path = ".", features = ["equality"] }
serde_json.workspace = true
