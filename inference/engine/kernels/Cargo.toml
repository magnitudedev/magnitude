[package]
name = "magnitude-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
seismic.workspace = true

[build-dependencies]
seismic-build.workspace = true
# The GGUF formats the registry imports (`gguf_format_tests`).
magnitude-ggml.workspace = true
seismic-lang.workspace = true

[dev-dependencies]
magnitude-ggml.workspace = true
seismic-lang.workspace = true
# The head-to-head's pool of a chosen size (`examples/kernel_h2h.rs`).
seismic-cpu.workspace = true
# The CPU's INT8 activation quantization, the rule every backend's follows
# (`tests/int8_rule`).
seismic-native-cpu.workspace = true
# The shared test-device selector.
seismic-native-tests.workspace = true
seismic-std.workspace = true
# Offline formation of focused requests (`tests/priming_formation.rs`).
seismic = { workspace = true, features = ["coverage"] }
