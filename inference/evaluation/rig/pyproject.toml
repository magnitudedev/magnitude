[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "magnitude-rig"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["magnitude-fixtures", "magnitude-bench"]

[project.scripts]
mrig = "magnitude_rig.cli:main"

[tool.uv.sources]
magnitude-fixtures = { workspace = true }
magnitude-bench = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Runs on hosts with their system Python (3.9 on macOS): no newer syntax.
"src/magnitude_rig/host/*" = ["UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/magnitude_rig"]
