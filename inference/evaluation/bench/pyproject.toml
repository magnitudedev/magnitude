[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "magnitude-bench"
version = "0.1.0"
description = "The serving benchmark: real fixture workloads over HTTP, our engine against comparison engines"
requires-python = ">=3.12"
dependencies = [
  "magnitude-fixtures",
  "magnitude-remote",
  "httpx==0.28.1",
  "psutil>=7",
  "pydantic==2.13.5",
  "gguf==0.19.0",
  "huggingface-hub>=1.27,<2",
  "tokenizers>=0.22,<1",
]

[project.scripts]
magnitude-bench = "magnitude_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magnitude_bench"]
