[package]
name = "magnitude-harness"
version.workspace = true
edition = "2024"
license.workspace = true

# The evaluation harness: the only in-process driver of the engine. It runs
# benchmark templates (specs/26-11-17/benchmark-templates.md) through the serving
# chat path and the executor, and writes evaluation result records.
[[bin]]
name = "magnitude-harness"
path = "src/main.rs"
required-features = ["dev-tools"]

# Host-only template rendering without development engine features, built in the
# same cargo invocation as the served engine so `mrig bench` compiles
# `magnitude-executor` and `magnitude-engine` once.
[[bin]]
name = "magnitude-render"
path = "src/bin/magnitude_render.rs"

[features]
default = ["dev-tools"]
# The engine's development tuning tools (pins, routing replay, machine-line
# probes and the survey), which only `magnitude-harness` enables; a served
# engine and `magnitude-render` build without them.
dev-tools = [
    "magnitude-engine/tuning-survey",
    "magnitude-engine/expert-routing",
    "magnitude-engine/machine-line",
]

[dependencies]
clap.workspace = true
libc.workspace = true
magnitude-artifacts = { path = "../../engine/artifacts" }
magnitude-chat = { path = "../../engine/chat" }
magnitude-engine = { path = "../../engine" }
magnitude-cost-model = { path = "../../engine/cost-model" }
magnitude-executor = { path = "../../engine/executor" }
magnitude-family-contracts = { path = "../../engine/families/contracts" }
magnitude-generation = { path = "../../engine/generation" }
# Kernel entries' names, which a prefill's attribution is read by.
magnitude-kernels = { path = "../../engine/kernels" }
magnitude-scheduler = { path = "../../engine/scheduler" }
magnitude-serving = { path = "../../engine/serving" }
magnitude-state = { path = "../../engine/state" }
seismic.workspace = true
seismic-io.workspace = true
serde.workspace = true
# Session key order is rendered: chat templates print tool schemas in it.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
# `memory`'s worker prints the scheduler's events.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The controlled execution domain (`magnitude_executor::fixtures`) the
# harness's step boundary is tested over.
magnitude-executor = { path = "../../engine/executor", features = ["fixtures"] }
# The reference expert lines the bar's tests are measured against.
magnitude-cost-model = { path = "../../engine/cost-model", features = ["fixtures"] }

[lints]
workspace = true
