[package]
name = "icn-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "magnitude-icn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
icn-api.workspace = true
icn-contracts.workspace = true
icn-engine.workspace = true
icn-hardware.workspace = true
icn-models.workspace = true
icn-mtp.workspace = true
icn-reasoning.workspace = true
libc.workspace = true
libloading = "0.8.9"
llama-cpp-2.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["mtmd", "dynamic-backends"]
cuda = ["icn-engine/cuda", "icn-hardware/cuda", "icn-mtp/cuda"]
cuda-no-vmm = ["icn-engine/cuda-no-vmm", "icn-hardware/cuda-no-vmm", "icn-mtp/cuda-no-vmm"]
dynamic-backends = ["llama-cpp-2/dynamic-backends"]
metal = ["icn-engine/metal", "icn-hardware/metal", "icn-mtp/metal"]
mtmd = ["icn-engine/mtmd", "icn-hardware/mtmd"]
vulkan = ["icn-engine/vulkan", "icn-hardware/vulkan", "icn-mtp/vulkan"]

[dev-dependencies]
tempfile = "3.24.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
