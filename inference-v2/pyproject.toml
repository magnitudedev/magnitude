[build-system]
requires = ["hatchling>=1.27", "mlx==0.32.2", "nanobind==2.15.0"]
build-backend = "hatchling.build"

[project]
name = "magnitude-engine"
version = "0.1.0"
description = "Composable Apple inference runtime for Magnitude"
requires-python = ">=3.12"
dependencies = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "mlx-vlm==0.6.17",
  "transformers==5.16.1",
  "llguidance==1.8.0",
  "psutil>=7",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "anyio>=4,<5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "hypothesis>=6",
  "ruff",
  "pyright",
  "httpx==0.28.1",
  "huggingface-hub>=0.34,<2",
  "gguf>=0.17",
  "textual>=1,<9",
]

[project.scripts]
session-bench = "session_bench.cli:main"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/magnitude_engine", "src/session_bench", "src/benchmark_fixtures", "performance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = ["model: requires a locally available model", "performance: measured performance qualification"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "performance"]
typeCheckingMode = "basic"

# Adapter instrumentation runs in the separately locked reference environment.
[[tool.pyright.executionEnvironments]]
root = "src/session_bench/engines/omlx_native"
extraPaths = ["src", "session-bench-runtimes/omlx/.venv/lib/python3.12/site-packages"]

[[tool.pyright.executionEnvironments]]
root = "."
