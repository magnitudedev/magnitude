[build-system]
requires = ["hatchling>=1.27", "cmake==4.4.3", "ninja==1.13.2"]
build-backend = "hatchling.build"

[project]
name = "magnitude-engine-v3"
version = "0.1.0"
description = "TileLang-native Magnitude inference engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "numpy>=2.5.3",
  "tilelang==0.1.14",
  "torch>=2.14.0",
  "httpx==0.28.1",
  "psutil>=7",
  "tokenizers==0.23.2",
  "llguidance==1.8.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "jinja2==3.1.6",
  "textual>=1,<9",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1",
  "hypothesis>=6",
  "ruff>=0.16.6",
  "pyright",
  "gguf==0.19.0",
  "huggingface-hub>=1.27,<2",
  "transformers==5.16.1",
]

[tool.uv.sources]
tilelang = { path = "tilelang", editable = true }

[project.scripts]
magnitude-performance = "ops.lab.__main__:main"
session-bench = "session_bench.cli:main"
magnitude-qualify = "engine.qualification:main"

[tool.hatch.build]
# Only the hook's freshly built library belongs in a wheel. This must also
# hold in source archives and checkouts without Git ignore metadata.
exclude = ["src/templates/_native/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/ops", "src/session_bench", "src/benchmark_fixtures", "src/templates"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "native/templates", "hatch_build.py", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "model: requires the pinned local model artifact",
  "device: requires a qualified execution endpoint",
  "performance: exclusive measured performance qualification",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/engine", "src/ops"]
typeCheckingMode = "basic"
# TileLang parses kernel annotations, scalar constructors and intrinsics as its
# own typed DSL. Python's checker cannot interpret those three expression forms;
# the compiler/reference suite checks them. Host operation contracts remain checked.
executionEnvironments = [
  { root = "src/ops/kernels", reportInvalidTypeForm = false, reportCallIssue = false, reportAttributeAccessIssue = false, reportOptionalMemberAccess = false, reportOperatorIssue = false },
  { root = "src/engine/numerics", reportInvalidTypeForm = false, reportCallIssue = false, reportAttributeAccessIssue = false },
  { root = "src/engine" },
]
